<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4BF0B8"/>
      <stop offset="0.55" stop-color="#34D9C0"/>
      <stop offset="1" stop-color="#1FA8D8"/>
    </linearGradient>
    <linearGradient id="shield" x1="160" y1="130" x2="352" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1512"/>
      <stop offset="1" stop-color="#0A1119" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="glyph" x1="200" y1="180" x2="320" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FFFB"/>
      <stop offset="1" stop-color="#CFF6E8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04211A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- плитка -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  <!-- мягкий блик -->
  <path d="M0 116C0 52 52 0 116 0h280c9 0 16 7 16 16v0C412 96 320 168 196 196 96 219 0 260 0 348V116Z" fill="#ffffff" fill-opacity="0.1"/>

  <!-- щит -->
  <g filter="url(#inner)">
    <path d="M256 108 392 168v128c0 92-58 160-136 188-78-28-136-96-136-188V168z" fill="url(#shield)" stroke="#04150F" stroke-opacity="0.35" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <path d="M256 118 382 173v123c0 86-54 150-126 177-72-27-126-91-126-177V173z" fill="none" stroke="#F2FFFB" stroke-opacity="0.16" stroke-width="4" stroke-linejoin="round"/>

  <!-- глиф питания -->
  <g filter="url(#soft)">
    <path d="M256 196v72" stroke="url(#glyph)" stroke-width="26" stroke-linecap="round"/>
    <path d="M203 232a74 74 0 1 0 106 0" fill="none" stroke="url(#glyph)" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
